	<!DOCTYPE html>
	<html lang="zh-CN">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>圣诞树动画 - Merry Christmas</title>
	    <style>
	        * {
	            margin: 0;
	            padding: 0;
	            box-sizing: border-box;
	        }
	        body {
	            display: flex;
	            justify-content: center;
	            align-items: center;
	            min-height: 100vh;
	            background: #1a1a2e;
	            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
	        }
	        .container {
	            display: flex;
	            flex-direction: column;
	            align-items: center;
	            gap: 20px;
	        }
	        .canvas-wrapper {
	            border-radius: 12px;
	            overflow: hidden;
	            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
	            position: relative;
	        }
	        canvas {
	            display: block;
	        }
	        .title {
	            color: #f0f0f0;
	            font-size: 28px;
	            font-weight: bold;
	            letter-spacing: 2px;
	            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
	        }
	        .controls {
	            display: flex;
	            gap: 10px;
	            flex-wrap: wrap;
	            justify-content: center;
	        }
	        .style-btn {
	            padding: 8px 20px;
	            border: 2px solid rgba(255, 255, 255, 0.3);
	            border-radius: 25px;
	            background: rgba(255, 255, 255, 0.1);
	            color: #fff;
	            font-size: 14px;
	            cursor: pointer;
	            transition: all 0.3s ease;
	        }
	        .style-btn:hover {
	            background: rgba(255, 255, 255, 0.25);
	            transform: translateY(-2px);
	        }
	        .style-btn.active {
	            background: rgba(255, 215, 0, 0.3);
	            border-color: #FFD700;
	            color: #FFD700;
	        }
	        .info {
	            color: rgba(255, 255, 255, 0.5);
	            font-size: 12px;
	        }
	    </style>
	</head>
	<body>
	    <div class="container">
	        <div class="title">🎄 Merry Christmas 🎄</div>
	        <div class="canvas-wrapper">
	            <canvas id="treeCanvas" width="480" height="600"></canvas>
	        </div>
	        <div class="controls" id="styleButtons"></div>
	        <div class="info">点击切换主题风格 | 使用鼠标拖拽旋转</div>
	    </div>
	    <script>
	        // ==================== 配置 ====================
	        const styles = {
	            1: {
	                name: 'Classic Gold',
	                bgCol: '#0f0505',
	                treeCols: ['#0B3D0B', '#144514', '#006400'],
	                trunkCol: '#3e2723',
	                decorCols: ['#FFD700', '#CCA43B', '#8B0000'],
	                starCol: '#FFD700',
	                textCol: '#FFD700',
	                snowCol: '#FFFFFF',
	                ribbon: true,
	                ribbonCol: '#D4AF37',
	                ribbonWidth: 0.4,
	                ribbonAlpha: 0.6
	            },
	            2: {
	                name: 'Winter Frost',
	                bgCol: '#F0F2F5',
	                treeCols: ['#2F4F4F', '#5F9EA0', '#708090'],
	                trunkCol: '#696969',
	                decorCols: ['#B0C4DE', '#FFFAF0', '#E0FFFF'],
	                starCol: '#B0C4DE',
	                textCol: '#708090',
	                snowCol: '#87CEFA',
	                ribbon: true,
	                ribbonCol: '#B0C4DE',
	                ribbonWidth: 0.4,
	                ribbonAlpha: 0.6
	            },
	            3: {
	                name: 'Olive Earth',
	                bgCol: '#1a1a1a',
	                treeCols: ['#556B2F', '#6B8E23', '#808000'],
	                trunkCol: '#5D4037',
	                decorCols: ['#CD853F', '#FFCC00'],
	                starCol: '#FFCC00',
	                textCol: '#DEB887',
	                snowCol: '#FFFFFF',
	                ribbon: false,
	                ribbonCol: null,
	                ribbonWidth: 0.4,
	                ribbonAlpha: 0.6
	            },
	            4: {
	                name: 'Neon Party',
	                bgCol: '#101010',
	                treeCols: ['#006400', '#228B22'],
	                trunkCol: '#4E342E',
	                decorCols: ['#FF0000', '#00FF00', '#0000FF', '#FFFF00'],
	                starCol: '#FFD700',
	                textCol: '#FF6347',
	                snowCol: '#FFFFFF',
	                ribbon: true,
	                ribbonCol: '#C0C0C0',
	                ribbonWidth: 0.4,
	                ribbonAlpha: 0.6
	            },
	            5: {
	                name: 'Midnight Silver',
	                bgCol: '#000000',
	                treeCols: ['#111111', '#050505'],
	                trunkCol: '#222222',
	                decorCols: ['#FFFFFF', '#FFFFE0'],
	                starCol: '#FFFFFF',
	                textCol: '#FFFFFF',
	                snowCol: 'rgba(128,128,128,1)',
	                ribbon: true,
	                ribbonCol: '#FFFFFF',
	                ribbonWidth: 0.4,
	                ribbonAlpha: 0.6
	            },
	            6: {
	                name: 'Pink Romance',
	                bgCol: '#1F0F12',
	                treeCols: ['#D87093', '#FF69B4', '#FFB6C1'],
	                trunkCol: '#4A3728',
	                decorCols: ['#FFFFFF', '#FFD700', '#FF1493'],
	                starCol: '#FFD700',
	                textCol: '#FFC0CB',
	                snowCol: '#FFF0F5',
	                ribbon: true,
	                ribbonCol: '#F8F8FF',
	                ribbonWidth: 0.4,
	                ribbonAlpha: 0.6
	            }
	        };
	        let currentStyleId = 1;
	        let cfg = styles[currentStyleId];
	        // ==================== 画布设置 ====================
	        const canvas = document.getElementById('treeCanvas');
	        const ctx = canvas.getContext('2d');
	        const W = canvas.width;
	        const H = canvas.height;
	        // ==================== 工具函数 ====================
	        function seededRandom(seed) {
	            let s = seed;
	            return function() {
	                s = (s * 9301 + 49297) % 233280;
	                return s / 233280;
	            };
	        }
	        function hexToRgba(hex, alpha) {
	            if (hex.startsWith('rgba')) return hex.replace(/[\d.]+\)$/, alpha + ')');
	            const r = parseInt(hex.slice(1, 3), 16);
	            const g = parseInt(hex.slice(3, 5), 16);
	            const b = parseInt(hex.slice(5, 7), 16);
	            return `rgba(${r},${g},${b},${alpha})`;
	        }
	        function getStarPolygon(xc, yc, radius) {
	            const points = [];
	            const angles = [];
	            const radii = [];
	            for (let i = 0; i < 10; i++) {
	                angles.push((i / 10) * Math.PI * 2);
	                radii.push(i % 2 === 0 ? radius : radius * 0.4);
	            }
	            for (let i = 0; i < 10; i++) {
	                const a = angles[i] - Math.PI / 2;
	                points.push({
	                    x: xc + radii[i] * Math.cos(a),
	                    y: yc + radii[i] * Math.sin(a)
	                });
	            }
	            return points;
	        }
	        // ==================== 数据生成 ====================
	        let staticData = [];
	        let snowData = [];
	        function generateTreeData(cfg, rand) {
	            const data = [];
	            const scale = Math.min(W, H) / 2.5;
	            // 树叶
	            const nLeaves = 6000;
	            for (let i = 0; i < nLeaves; i++) {
	                const h = rand();
	                const baseR = 1 - h;
	                const layerCycle = (h * 7) % 1;
	                const r = baseR * 0.65 * (0.4 + 0.6 * Math.pow(1 - layerCycle, 0.7));
	                const theta = rand() * Math.PI * 2;
	                data.push({
	                    x: r * Math.cos(theta) * scale,
	                    y: (h - 0.5) * scale,
	                    z: r * Math.sin(theta),
	                    color: cfg.treeCols[Math.floor(rand() * cfg.treeCols.length)],
	                    size: 0.4 + rand() * 0.6,
	                    type: 'tree',
	                    alpha: 0.9
	                });
	            }
	            // 树干
	            const nTrunk = 800;
	            for (let i = 0; i < nTrunk; i++) {
	                const hTrunk = -0.7 + rand() * 0.25;
	                const rTrunk = 0.12;
	                const thetaTrunk = rand() * Math.PI * 2;
	                data.push({
	                    x: rTrunk * Math.cos(thetaTrunk) * scale,
	                    y: hTrunk * scale,
	                    z: rTrunk * Math.sin(thetaTrunk),
	                    color: cfg.trunkCol,
	                    size: 0.8,
	                    type: 'trunk',
	                    alpha: 1
	                });
	            }
	            // 装饰
	            const nDecor = 400;
	            for (let i = 0; i < nDecor; i++) {
	                const hDec = rand() * 0.95;
	                const baseRDec = 1 - hDec;
	                const layerCycleDec = (hDec * 7) % 1;
	                const rDec = baseRDec * 0.68 * (0.4 + 0.6 * Math.pow(1 - layerCycleDec, 0.7));
	                const thetaDec = rand() * Math.PI * 2;
	                data.push({
	                    x: rDec * Math.cos(thetaDec) * scale,
	                    y: (hDec - 0.5) * scale,
	                    z: rDec * Math.sin(thetaDec),
	                    color: cfg.decorCols[Math.floor(rand() * cfg.decorCols.length)],
	                    size: 1.5 + rand() * 1.0,
	                    type: 'decor',
	                    alpha: 1
	                });
	            }
	            // 丝带
	            if (cfg.ribbon) {
	                const nRib = 4000;
	                for (let i = 0; i < nRib; i++) {
	                    const hRib = (i / nRib) * 0.95;
	                    const baseRRib = (1 - hRib) * 0.65 * 1.05;
	                    const thetaRib = 10 * Math.PI * hRib;
	                    data.push({
	                        x: baseRRib * Math.cos(thetaRib) * scale,
	                        y: (hRib - 0.5) * scale,
	                        z: baseRRib * Math.sin(thetaRib),
	                        color: cfg.ribbonCol,
	                        size: cfg.ribbonWidth,
	                        type: 'ribbon',
	                        alpha: cfg.ribbonAlpha
	                    });
	                }
	            }
	            return data;
	        }
	        function generateSnow(nFlakes, rand) {
	            const scale = Math.min(W, H) / 2.5;
	            const snow = [];
	            for (let i = 0; i < nFlakes; i++) {
	                snow.push({
	                    x: (rand() * 2.4 - 1.2) * scale,
	                    y: (rand() * 2.0 - 0.8) * scale,
	                    z: rand() * 2 - 1,
	                    color: cfg.snowCol,
	                    size: 0.3 + rand() * 0.9,
	                    alpha: 0.5 + rand() * 0.4,
	                    speed: 0.015 + rand() * 0.02,
	                    phase: rand() * Math.PI * 2
	                });
	            }
	            return snow;
	        }
	        // ==================== 动画状态 ====================
	        let angle = 0;
	        let frame = 0;
	        let autoRotate = true;
	        let mouseX = 0;
	        let isDragging = false;
	        let dragStartX = 0;
	        let dragStartAngle = 0;
	        const SCALE = Math.min(W, H) / 2.5;
	        const starRadius = 0.08 * SCALE;
	        // ==================== 初始化 ====================
	        function initScene() {
	            const rand = seededRandom(2025);
	            staticData = generateTreeData(cfg, rand);
	            snowData = generateSnow(150, rand);
	        }
	        // ==================== 渲染函数 ====================
	        function render() {
	            // 清除画布
	            ctx.fillStyle = cfg.bgCol;
	            ctx.fillRect(0, 0, W, H);
	            const cx = W / 2;
	            const cy = H / 2 + 30;
	            const cosA = Math.cos(angle);
	            const sinA = Math.sin(angle);
	            // 收集所有点进行深度排序
	            const allPoints = [];
	            // 静态数据（树）
	            for (let i = 0; i < staticData.length; i++) {
	                const p = staticData[i];
	                const xRot = p.x * cosA - p.z * sinA * SCALE;
	                const zRot = p.z * cosA + p.x * sinA / SCALE;
	                const depth = 1 / (2.5 - zRot);
	                const xProj = cx + xRot * depth * 1.4;
	                const yProj = cy - p.y * depth * 1.4;
	                let alpha = p.alpha;
	                if (p.type === 'tree') {
	                    alpha *= (zRot + 1.2) / 2.2;
	                }
	                allPoints.push({
	                    x: xProj,
	                    y: yProj,
	                    z: zRot,
	                    depth: depth,
	                    color: p.color,
	                    size: p.size * depth * 6,
	                    alpha: Math.max(0.05, Math.min(1, alpha))
	                });
	            }
	            // 雪花
	            const time = Date.now() * 0.001;
	            for (let i = 0; i < snowData.length; i++) {
	                const s = snowData[i];
	                const yFall = ((s.y / SCALE + 0.8 - time * s.speed * 2) % 2.0 + 2.0) % 2.0 - 0.8;
	                const xSway = Math.sin(time * 1.5 + s.phase) * 20;
	                const depth = 1 / (2.5 - s.z);
	                const xProj = cx + (s.x + xSway) * depth * 1.4;
	                const yProj = cy - yFall * SCALE * depth * 1.4;
	                allPoints.push({
	                    x: xProj,
	                    y: yProj,
	                    z: s.z,
	                    depth: depth,
	                    color: s.color,
	                    size: s.size * depth * 6,
	                    alpha: s.alpha * 0.8
	                });
	            }
	            // 深度排序（远的先画）
	            allPoints.sort((a, b) => a.z - b.z);
	            // 绘制所有点
	            for (let i = 0; i < allPoints.length; i++) {
	                const p = allPoints[i];
	                if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) continue;
	                ctx.globalAlpha = p.alpha;
	                ctx.fillStyle = p.color;
	                ctx.beginPath();
	                ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
	                ctx.fill();
	            }
	            ctx.globalAlpha = 1;
	            // 绘制五角星
	            const starY = cy - 0.4 * SCALE * 1.4;
	            drawStar(cx, starY, starRadius, time);
	            // 绘制文字
	            drawText(cx, cy - 0.6 * SCALE * 1.4);
	        }
	        function drawStar(x, y, radius, time) {
	            // 闪烁效果
	            const pulse = 0.7 + 0.3 * Math.sin(time * 4);
	            const glow = 0.3 + 0.2 * Math.sin(time * 2);
	            // 外发光
	            ctx.save();
	            ctx.globalAlpha = glow;
	            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius * 3);
	            gradient.addColorStop(0, cfg.starCol);
	            gradient.addColorStop(1, 'transparent');
	            ctx.fillStyle = gradient;
	            ctx.beginPath();
	            ctx.arc(x, y, radius * 3, 0, Math.PI * 2);
	            ctx.fill();
	            ctx.restore();
	            // 主五角星
	            const points = getStarPolygon(x, y, radius * pulse);
	            ctx.save();
	            ctx.fillStyle = cfg.starCol;
	            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
	            ctx.lineWidth = 1;
	            ctx.beginPath();
	            ctx.moveTo(points[0].x, points[0].y);
	            for (let i = 1; i < points.length; i++) {
	                ctx.lineTo(points[i].x, points[i].y);
	            }
	            ctx.closePath();
	            ctx.fill();
	            ctx.stroke();
	            ctx.restore();
	            // 内部亮星
	            const innerPoints = getStarPolygon(x, y, radius * 0.6 * pulse);
	            ctx.save();
	            ctx.fillStyle = `rgba(255,255,160,${0.4 + 0.2 * pulse})`;
	            ctx.beginPath();
	            ctx.moveTo(innerPoints[0].x, innerPoints[0].y);
	            for (let i = 1; i < innerPoints.length; i++) {
	                ctx.lineTo(innerPoints[i].x, innerPoints[i].y);
	            }
	            ctx.closePath();
	            ctx.fill();
	            ctx.restore();
	        }
	        function drawText(x, y) {
	            ctx.save();
	            ctx.font = `bold italic 36px Georgia, serif`;
	            ctx.textAlign = 'center';
	            ctx.textBaseline = 'middle';
	            // 阴影
	            ctx.shadowColor = cfg.textCol;
	            ctx.shadowBlur = 15;
	            ctx.fillStyle = cfg.textCol;
	            ctx.fillText('Merry Christmas', x, y);
	            ctx.shadowBlur = 0;
	            ctx.restore();
	        }
	        // ==================== 主题切换 ====================
	        const buttonContainer = document.getElementById('styleButtons');
	        Object.keys(styles).forEach(id => {
	            const btn = document.createElement('button');
	            btn.className = 'style-btn' + (id == currentStyleId ? ' active' : '');
	            btn.textContent = styles[id].name;
	            btn.onclick = () => {
	                currentStyleId = parseInt(id);
	                cfg = styles[currentStyleId];
	                initScene();
	                // 更新按钮状态
	                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
	                btn.classList.add('active');
	            };
	            buttonContainer.appendChild(btn);
	        });
	        // ==================== 鼠标交互 ====================
	        canvas.addEventListener('mousedown', (e) => {
	            isDragging = true;
	            autoRotate = false;
	            dragStartX = e.clientX;
	            dragStartAngle = angle;
	        });
	        canvas.addEventListener('mousemove', (e) => {
	            if (isDragging) {
	                const dx = e.clientX - dragStartX;
	                angle = dragStartAngle + dx * 0.005;
	            }
	        });
	        canvas.addEventListener('mouseup', () => {
	            isDragging = false;
	        });
	        canvas.addEventListener('mouseleave', () => {
	            isDragging = false;
	        });
	        // 触摸支持
	        canvas.addEventListener('touchstart', (e) => {
	            isDragging = true;
	            autoRotate = false;
	            dragStartX = e.touches[0].clientX;
	            dragStartAngle = angle;
	        });
	        canvas.addEventListener('touchmove', (e) => {
	            if (isDragging) {
	                const dx = e.touches[0].clientX - dragStartX;
	                angle = dragStartAngle + dx * 0.005;
	                e.preventDefault();
	            }
	        });
	        canvas.addEventListener('touchend', () => {
	            isDragging = false;
	        });
	        // 双击恢复自动旋转
	        canvas.addEventListener('dblclick', () => {
	            autoRotate = !autoRotate;
	        });
	        // ==================== 动画循环 ====================
	        function animate() {
	            if (autoRotate && !isDragging) {
	                angle += 0.02;
	            }
	            render();
	            requestAnimationFrame(animate);
	        }
	        // ==================== 启动 ====================
	        initScene();
	        animate();
	    </script>
	</body>
	</html>
